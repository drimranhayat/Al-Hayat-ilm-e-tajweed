<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 640" role="img" aria-label="مد کی اقسام کا فیصلہ چارٹ" direction="rtl"><title>مد کی اقسام کا فیصلہ چارٹ</title><defs><marker id="dgArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor" style="color:var(--muted)"/></marker></defs><text class="dg-t" x="450" y="26" text-anchor="middle">مد کی قسم کیسے پہچانیں؟</text><rect class="dg-box g" x="330" y="44" width="240" height="50" rx="12"/><text class="dg-t" x="450.0" y="74.0" text-anchor="middle">حرفِ مد (ا / و / ی) موجود ہے</text><path class="dg-arrow" d="M450 94 L450 126" style="color:var(--muted)"/><rect class="dg-box y" x="330" y="126" width="240" height="50" rx="12"/><text class="dg-t" x="450.0" y="156.0" text-anchor="middle">اس کے بعد ہمزہ ہے؟</text><path class="dg-arrow" d="M570 151 L700 151" style="color:var(--muted)"/><text class="dg-s" x="641.0" y="140" text-anchor="middle" style="fill:var(--green);font-weight:700">ہاں</text><rect class="dg-box y" x="650" y="126" width="220" height="50" rx="12"/><text class="dg-t" x="760.0" y="156.0" text-anchor="middle">ایک ہی کلمے میں؟</text><path class="dg-arrow" d="M760 176 L760 216" style="color:var(--muted)"/><text class="dg-s" x="780" y="196.0" text-anchor="middle" style="fill:var(--green);font-weight:700">ہاں</text><rect class="dg-box g" x="660" y="216" width="200" height="74" rx="12"/><text class="dg-t" x="760.0" y="247.0" text-anchor="middle">مدِ متصل</text><text class="dg-s" x="760.0" y="269.0" text-anchor="middle">واجب — ۴ یا ۵ حرکات</text><path class="dg-arrow" d="M650 151 L560 250" style="color:var(--muted)"/><text class="dg-s" x="600" y="185" text-anchor="middle" style="fill:var(--green);font-weight:700">نہیں</text><rect class="dg-box g" x="470" y="216" width="190" height="74" rx="12"/><text class="dg-t" x="565.0" y="247.0" text-anchor="middle">مدِ منفصل</text><text class="dg-s" x="565.0" y="269.0" text-anchor="middle">جائز — ۴ یا ۵ حرکات</text><path class="dg-arrow" d="M330 151 L200 151" style="color:var(--muted)"/><text class="dg-s" x="271.0" y="140" text-anchor="middle" style="fill:var(--green);font-weight:700">نہیں</text><rect class="dg-box y" x="40" y="126" width="220" height="50" rx="12"/><text class="dg-t" x="150.0" y="156.0" text-anchor="middle">اس کے بعد سکون ہے؟</text><path class="dg-arrow" d="M150 176 L150 216" style="color:var(--muted)"/><text class="dg-s" x="130" y="196.0" text-anchor="middle" style="fill:var(--green);font-weight:700">نہیں</text><rect class="dg-box b" x="40" y="216" width="220" height="74" rx="12"/><text class="dg-t" x="150.0" y="247.0" text-anchor="middle">مدِ طبعی (اصلی)</text><text class="dg-s" x="150.0" y="269.0" text-anchor="middle">۲ حرکات</text><path class="dg-arrow" d="M260 151 L330 330" style="color:var(--muted)"/><text class="dg-s" x="330" y="250" text-anchor="middle" style="fill:var(--green);font-weight:700">ہاں</text><rect class="dg-box y" x="300" y="330" width="300" height="50" rx="12"/><text class="dg-t" x="450.0" y="360.0" text-anchor="middle">سکون اصلی ہے یا وقف کی وجہ سے؟</text><path class="dg-arrow" d="M570 380 L690 430" style="color:var(--muted)"/><text class="dg-s" x="650" y="395" text-anchor="middle" style="fill:var(--green);font-weight:700">اصلی</text><rect class="dg-box r" x="590" y="430" width="270" height="90" rx="12"/><text class="dg-t" x="725.0" y="458.0" text-anchor="middle">مدِ لازم</text><text class="dg-s" x="725.0" y="480.0" text-anchor="middle">۶ حرکات</text><text class="dg-s" x="725.0" y="502.0" text-anchor="middle">(مشدد/ساکن: الضّالین، آلآن، الم)</text><path class="dg-arrow" d="M330 380 L210 430" style="color:var(--muted)"/><text class="dg-s" x="240" y="395" text-anchor="middle" style="fill:var(--green);font-weight:700">وقفی</text><rect class="dg-box r" x="40" y="430" width="270" height="90" rx="12"/><text class="dg-t" x="175.0" y="458.0" text-anchor="middle">مدِ عارض للسکون</text><text class="dg-s" x="175.0" y="480.0" text-anchor="middle">تین وجوہ: قصر، توسط، اشباع</text><text class="dg-s" x="175.0" y="502.0" text-anchor="middle">(العالمین پر وقف)</text><rect class="dg-box " x="330" y="560" width="300" height="60" rx="12"/><text class="dg-s" x="480.0" y="584.0" text-anchor="middle">خاص: ہمزہ مد سے پہلے ہو (آمنوا) ← مدِ بدل: ۲ حرکات</text><text class="dg-s" x="480.0" y="606.0" text-anchor="middle">واؤ/یاء ساکن، ماقبل زبر، وقف ← مدِ لین</text></svg>