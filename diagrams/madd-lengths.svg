<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" role="img" aria-label="مد کی مقداریں" direction="rtl"><title>مد کی مقداریں</title><defs><marker id="dgArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor" style="color:var(--muted)"/></marker></defs><text class="dg-t" x="450" y="26" text-anchor="middle">مد کی مقداریں (حرکات میں): ایک حرکت ≈ ایک انگلی کھولنے یا بند کرنے کا وقت</text><line class="dg-lead" x1="800" y1="52" x2="800" y2="372"/><text class="dg-s" x="800" y="392" text-anchor="middle">۰</text><line class="dg-lead" x1="700" y1="52" x2="700" y2="372"/><text class="dg-s" x="700" y="392" text-anchor="middle">۱</text><line class="dg-lead" x1="600" y1="52" x2="600" y2="372"/><text class="dg-s" x="600" y="392" text-anchor="middle">۲</text><line class="dg-lead" x1="500" y1="52" x2="500" y2="372"/><text class="dg-s" x="500" y="392" text-anchor="middle">۳</text><line class="dg-lead" x1="400" y1="52" x2="400" y2="372"/><text class="dg-s" x="400" y="392" text-anchor="middle">۴</text><line class="dg-lead" x1="300" y1="52" x2="300" y2="372"/><text class="dg-s" x="300" y="392" text-anchor="middle">۵</text><line class="dg-lead" x1="200" y1="52" x2="200" y2="372"/><text class="dg-s" x="200" y="392" text-anchor="middle">۶</text><text class="dg-s" x="860" y="76" text-anchor="middle"></text><rect x="600" y="92" width="200" height="22" rx="8" fill="var(--green)" opacity=".85"/><text class="dg-t" x="800" y="82" text-anchor="start">طبعی، بدل، عوض، صلہ صغریٰ</text><text class="dg-s" x="860" y="154" text-anchor="middle"></text><rect x="400" y="170" width="400" height="22" rx="8" fill="var(--gold)" opacity=".85"/><rect x="300" y="170" width="100" height="22" fill="var(--gold)" opacity=".45"/><text class="dg-t" x="800" y="160" text-anchor="start">متصل، منفصل، صلہ کبریٰ</text><text class="dg-s" x="860" y="232" text-anchor="middle"></text><rect x="600" y="244" width="200" height="9" rx="4" fill="var(--blue)" opacity="0.9"/><rect x="400" y="256" width="400" height="9" rx="4" fill="var(--blue)" opacity="0.7"/><rect x="200" y="268" width="600" height="9" rx="4" fill="var(--blue)" opacity="0.5"/><text class="dg-t" x="800" y="238" text-anchor="start">عارض للسکون، لین</text><text class="dg-s" x="860" y="310" text-anchor="middle"></text><rect x="200" y="326" width="600" height="22" rx="8" fill="var(--red)" opacity=".85"/><text class="dg-t" x="800" y="316" text-anchor="start">لازم</text><text class="dg-s" x="450" y="412" text-anchor="middle">(عارض و لین میں ۲، ۴، ۶ میں سے کوئی ایک مقدار؛ پوری تلاوت میں یکساں رکھیں)</text></svg>