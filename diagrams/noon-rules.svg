<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" role="img" aria-label="نونِ ساکن کے چار احکام" direction="rtl"><title>نونِ ساکن کے چار احکام</title><defs><marker id="dgArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor" style="color:var(--muted)"/></marker></defs><text class="dg-t" x="450" y="26" text-anchor="middle">نونِ ساکن اور تنوین: بعد والے حرف سے چار احکام</text><rect class="dg-box g" x="330" y="44" width="240" height="50" rx="12"/><text class="dg-t" x="450.0" y="74.0" text-anchor="middle">نونِ ساکن / تنوین</text><path class="dg-arrow" d="M450 94 L790.0 128" style="color:var(--muted)"/><rect class="dg-box b" x="690" y="128" width="200" height="270" rx="12"/><text class="dg-t" x="790.0" y="162" text-anchor="middle">اظہار</text><text class="dg-s" x="790.0" y="186" text-anchor="middle">بغیر غنہ — حلقی حروف</text><text class="dg-ar" x="790.0" y="230" text-anchor="middle">ء  ہ  ع</text><text class="dg-ar" x="790.0" y="274" text-anchor="middle">ح  غ  خ</text><text class="dg-s" x="790.0" y="332" text-anchor="middle">۶ حروف</text><text class="dg-ar-s" x="790.0" y="372" text-anchor="middle">مَنْ آمَنَ</text><path class="dg-arrow" d="M450 94 L570.0 128" style="color:var(--muted)"/><rect class="dg-box y" x="470" y="128" width="200" height="270" rx="12"/><text class="dg-t" x="570.0" y="162" text-anchor="middle">ادغام</text><text class="dg-s" x="570.0" y="186" text-anchor="middle">یرملون</text><text class="dg-ar" x="570.0" y="230" text-anchor="middle">ی  ر  م</text><text class="dg-ar" x="570.0" y="274" text-anchor="middle">ل  و  ن</text><text class="dg-s" x="570.0" y="332" text-anchor="middle">۶ حروف</text><text class="dg-ar-s" x="570.0" y="372" text-anchor="middle">مَنْ يَقُولُ</text><path class="dg-arrow" d="M450 94 L350.0 128" style="color:var(--muted)"/><rect class="dg-box r" x="250" y="128" width="200" height="270" rx="12"/><text class="dg-t" x="350.0" y="162" text-anchor="middle">قلب</text><text class="dg-s" x="350.0" y="186" text-anchor="middle">میم سے بدل + اخفاء + غنہ</text><text class="dg-ar" x="350.0" y="230" text-anchor="middle">ب</text><text class="dg-s" x="350.0" y="332" text-anchor="middle">۱ حرف</text><text class="dg-ar-s" x="350.0" y="372" text-anchor="middle">مِنْ بَعْدِ</text><path class="dg-arrow" d="M450 94 L130.0 128" style="color:var(--muted)"/><rect class="dg-box g" x="30" y="128" width="200" height="270" rx="12"/><text class="dg-t" x="130.0" y="162" text-anchor="middle">اخفاء</text><text class="dg-s" x="130.0" y="186" text-anchor="middle">غنہ کے ساتھ، تشدید کے بغیر</text><text class="dg-ar" x="130.0" y="230" text-anchor="middle">ص  ذ  ث  ک  ج</text><text class="dg-ar" x="130.0" y="274" text-anchor="middle">ش  ق  س  د  ط</text><text class="dg-ar" x="130.0" y="318" text-anchor="middle">ز  ف  ت  ض  ظ</text><text class="dg-s" x="130.0" y="332" text-anchor="middle">۱۵ حروف</text><text class="dg-ar-s" x="130.0" y="372" text-anchor="middle">مِنْكُمْ</text><text class="dg-s" x="450" y="424" text-anchor="middle">ادغام میں: ی ن م و ← بغنہ؛  ل ر ← بلا غنہ     |     ایک ہی کلمے میں (دُنْیا، بُنْیان، قِنْوان، صِنْوان) ← اظہارِ مطلق</text><text class="dg-s" x="450" y="452" text-anchor="middle">۶ + ۶ + ۱ + ۱۵ = ۲۸ حروفِ ہجا (ہمزہ کے ساتھ، الف کے بغیر)</text></svg>