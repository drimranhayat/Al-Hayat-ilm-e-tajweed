<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" role="img" aria-label="شدت، توسط اور رخاوت" direction="rtl"><title>شدت، توسط اور رخاوت</title><defs><marker id="dgArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor" style="color:var(--muted)"/></marker></defs><text class="dg-t" x="450" y="28" text-anchor="middle">شدت — توسط — رخاوت: آواز مخرج پر کتنی رکتی ہے</text><defs><linearGradient id="gSh" x1="1" y1="0" x2="0" y2="0"><stop offset="0" stop-color="var(--red)"/><stop offset=".5" stop-color="var(--gold)"/><stop offset="1" stop-color="var(--blue)"/></linearGradient></defs><rect x="40" y="52" width="820" height="16" rx="8" fill="url(#gSh)" opacity=".85"/><text class="dg-s" x="850" y="90" text-anchor="middle">بند</text><text class="dg-s" x="50" y="90" text-anchor="middle">جاری</text><rect class="dg-box r" x="620" y="108" width="240" height="190" rx="12"/><text class="dg-t" x="740.0" y="138" text-anchor="middle">شدت</text><text class="dg-s" x="740.0" y="162" text-anchor="middle">آواز رک جاتی ہے</text><text class="dg-ar-s" x="740.0" y="200" text-anchor="middle">أجد قط بكت</text><text class="dg-ar-s" x="740.0" y="252" text-anchor="middle">ء  ج  د  ق  ط  ب  ک  ت</text><text class="dg-s" x="740.0" y="282" text-anchor="middle">۸ حروف</text><rect class="dg-box y" x="400" y="108" width="200" height="190" rx="12"/><text class="dg-t" x="500.0" y="138" text-anchor="middle">توسط</text><text class="dg-s" x="500.0" y="162" text-anchor="middle">نہ پوری رکتی، نہ پوری جاری</text><text class="dg-ar-s" x="500.0" y="200" text-anchor="middle">لن عمر</text><text class="dg-ar-s" x="500.0" y="252" text-anchor="middle">ل  ن  ع  م  ر</text><text class="dg-s" x="500.0" y="282" text-anchor="middle">۵ حروف</text><rect class="dg-box b" x="40" y="108" width="340" height="190" rx="12"/><text class="dg-t" x="210.0" y="138" text-anchor="middle">رخاوت</text><text class="dg-s" x="210.0" y="162" text-anchor="middle">آواز جاری رہتی ہے</text><text class="dg-ar-s" x="210.0" y="200" text-anchor="middle"></text><text class="dg-ar-s" x="210.0" y="252" text-anchor="middle">ا ث ح خ ذ ز س ش ص ض ظ غ ف ہ و ی</text><text class="dg-s" x="210.0" y="282" text-anchor="middle">۱۶ حروف</text><text class="dg-s" x="450" y="322" text-anchor="middle">۸ + ۵ + ۱۶ = ۲۹ حروف</text></svg>