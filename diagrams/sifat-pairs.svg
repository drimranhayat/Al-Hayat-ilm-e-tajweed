<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" role="img" aria-label="پانچ ضدّی جوڑے" direction="rtl"><title>پانچ ضدّی جوڑے</title><defs><marker id="dgArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor" style="color:var(--muted)"/></marker></defs><text class="dg-t" x="450" y="28" text-anchor="middle">پانچ ضدّی جوڑے: ہر حرف میں ہر جوڑے کی ایک صفت ضرور ہے</text><rect class="dg-box g" x="480" y="50" width="380" height="64" rx="12"/><text class="dg-t" x="700" y="76" text-anchor="middle">ہمس  (۱۰)</text><text class="dg-ar-s" x="700" y="104" text-anchor="middle">فحثه شخص سكت</text><rect class="dg-box b" x="40" y="50" width="380" height="64" rx="12"/><text class="dg-t" x="230" y="76" text-anchor="middle">جہر  (۱۹)</text><text class="dg-s" x="230" y="102" text-anchor="middle">باقی</text><text class="dg-t" x="450" y="88" text-anchor="middle" style="fill:var(--gold)">⇄</text><rect class="dg-box g" x="480" y="128" width="380" height="64" rx="12"/><text class="dg-t" x="700" y="154" text-anchor="middle">شدت  (۸)</text><text class="dg-ar-s" x="700" y="182" text-anchor="middle">أجد قط بكت</text><rect class="dg-box b" x="40" y="128" width="380" height="64" rx="12"/><text class="dg-t" x="230" y="154" text-anchor="middle">رخاوت  (۱۶)</text><text class="dg-s" x="230" y="180" text-anchor="middle">باقی (توسط کے سوا)</text><text class="dg-t" x="450" y="166" text-anchor="middle" style="fill:var(--gold)">⇄</text><rect class="dg-box g" x="480" y="206" width="380" height="64" rx="12"/><text class="dg-t" x="700" y="232" text-anchor="middle">استعلاء  (۷)</text><text class="dg-ar-s" x="700" y="260" text-anchor="middle">خص ضغط قظ</text><rect class="dg-box b" x="40" y="206" width="380" height="64" rx="12"/><text class="dg-t" x="230" y="232" text-anchor="middle">استفال  (۲۲)</text><text class="dg-s" x="230" y="258" text-anchor="middle">باقی</text><text class="dg-t" x="450" y="244" text-anchor="middle" style="fill:var(--gold)">⇄</text><rect class="dg-box g" x="480" y="284" width="380" height="64" rx="12"/><text class="dg-t" x="700" y="310" text-anchor="middle">اطباق  (۴)</text><text class="dg-ar-s" x="700" y="338" text-anchor="middle">ص ض ط ظ</text><rect class="dg-box b" x="40" y="284" width="380" height="64" rx="12"/><text class="dg-t" x="230" y="310" text-anchor="middle">انفتاح  (۲۵)</text><text class="dg-s" x="230" y="336" text-anchor="middle">باقی</text><text class="dg-t" x="450" y="322" text-anchor="middle" style="fill:var(--gold)">⇄</text><rect class="dg-box g" x="480" y="362" width="380" height="64" rx="12"/><text class="dg-t" x="700" y="388" text-anchor="middle">اذلاق  (۶)</text><text class="dg-ar-s" x="700" y="416" text-anchor="middle">فر من لب</text><rect class="dg-box b" x="40" y="362" width="380" height="64" rx="12"/><text class="dg-t" x="230" y="388" text-anchor="middle">اصمات  (۲۳)</text><text class="dg-s" x="230" y="414" text-anchor="middle">باقی</text><text class="dg-t" x="450" y="400" text-anchor="middle" style="fill:var(--gold)">⇄</text><text class="dg-s" x="450" y="448" text-anchor="middle">توسط (۵: لن عمر) شدت اور رخاوت کے بیچ ہے؛ اس لیے رخاوت کے ۱۶ حروف = ۲۹ − ۸ − ۵</text></svg>