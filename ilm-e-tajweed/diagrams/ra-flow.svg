<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 700" role="img" aria-label="راء کے احکام کا فیصلہ چارٹ" direction="rtl"><title>راء کے احکام کا فیصلہ چارٹ</title><defs><marker id="dgArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor" style="color:var(--muted)"/></marker></defs><text class="dg-t" x="450" y="26" text-anchor="middle">راء: تفخیم (پُر) یا ترقیق (باریک)؟</text><rect class="dg-box g" x="330" y="44" width="240" height="46" rx="12"/><text class="dg-t" x="450.0" y="72.0" text-anchor="middle">راء</text><path class="dg-arrow" d="M450 90 L450 118" style="color:var(--muted)"/><rect class="dg-box y" x="330" y="118" width="240" height="46" rx="12"/><text class="dg-t" x="450.0" y="146.0" text-anchor="middle">راء متحرک ہے یا ساکن؟</text><path class="dg-arrow" d="M570 141 L690 141" style="color:var(--muted)"/><text class="dg-s" x="636.0" y="130" text-anchor="middle" style="fill:var(--green);font-weight:700">متحرک</text><rect class="dg-box y" x="690" y="118" width="190" height="46" rx="12"/><text class="dg-t" x="785.0" y="146.0" text-anchor="middle">حرکت کیا ہے؟</text><path class="dg-arrow" d="M760 164 L790 210" style="color:var(--muted)"/><path class="dg-arrow" d="M800 164 L800 210" style="color:var(--muted)"/><rect class="dg-box g" x="690" y="210" width="190" height="64" rx="12"/><text class="dg-t" x="785.0" y="236.0" text-anchor="middle">زبر یا پیش</text><text class="dg-s" x="785.0" y="258.0" text-anchor="middle">پُر: رَبِّ، رُسُل</text><path class="dg-arrow" d="M700 164 L640 210" style="color:var(--muted)"/><rect class="dg-box b" x="480" y="210" width="190" height="64" rx="12"/><text class="dg-t" x="575.0" y="236.0" text-anchor="middle">زیر</text><text class="dg-s" x="575.0" y="258.0" text-anchor="middle">باریک: رِزْق، رِجَال</text><path class="dg-arrow" d="M330 141 L210 141" style="color:var(--muted)"/><text class="dg-s" x="276.0" y="130" text-anchor="middle" style="fill:var(--green);font-weight:700">ساکن</text><rect class="dg-box y" x="20" y="118" width="190" height="46" rx="12"/><text class="dg-t" x="115.0" y="146.0" text-anchor="middle">اس سے پہلے کی حرکت؟</text><path class="dg-arrow" d="M115 164 L115 210" style="color:var(--muted)"/><rect class="dg-box g" x="20" y="210" width="190" height="64" rx="12"/><text class="dg-t" x="115.0" y="236.0" text-anchor="middle">زبر یا پیش</text><text class="dg-s" x="115.0" y="258.0" text-anchor="middle">پُر: ارْكُضْ، الْأَرْض</text><path class="dg-arrow" d="M210 141 L250 220" style="color:var(--muted)"/><text class="dg-s" x="252" y="180" text-anchor="middle" style="fill:var(--green);font-weight:700">زیر</text><rect class="dg-box y" x="235" y="210" width="230" height="64" rx="12"/><text class="dg-t" x="350.0" y="236.0" text-anchor="middle">زیر (کسرہ)</text><text class="dg-s" x="350.0" y="258.0" text-anchor="middle">اب کسرہ کی قسم دیکھیں</text><path class="dg-arrow" d="M350 274 L350 316" style="color:var(--muted)"/><rect class="dg-box y" x="235" y="316" width="230" height="64" rx="12"/><text class="dg-t" x="350.0" y="342.0" text-anchor="middle">کسرہ اصلی ہے اور</text><text class="dg-t" x="350.0" y="364.0" text-anchor="middle">راء کے ساتھ ایک کلمے میں؟</text><path class="dg-arrow" d="M235 348 L130 348" style="color:var(--muted)"/><text class="dg-s" x="188.5" y="338" text-anchor="middle" style="fill:var(--green);font-weight:700">نہیں</text><rect class="dg-box g" x="20" y="316" width="110" height="64" rx="12"/><text class="dg-t" x="75.0" y="342.0" text-anchor="middle">پُر</text><text class="dg-s" x="75.0" y="364.0" text-anchor="middle">ارْجِعُوا</text><path class="dg-arrow" d="M350 380 L350 424" style="color:var(--muted)"/><text class="dg-s" x="372" y="404" text-anchor="middle" style="fill:var(--green);font-weight:700">ہاں</text><rect class="dg-box y" x="235" y="424" width="230" height="64" rx="12"/><text class="dg-t" x="350.0" y="450.0" text-anchor="middle">اسی کلمے میں راء کے بعد</text><text class="dg-t" x="350.0" y="472.0" text-anchor="middle">مستعلی (غیر مکسور) ہے؟</text><path class="dg-arrow" d="M235 456 L130 456" style="color:var(--muted)"/><text class="dg-s" x="188.5" y="446" text-anchor="middle" style="fill:var(--green);font-weight:700">نہیں</text><rect class="dg-box b" x="20" y="424" width="110" height="64" rx="12"/><text class="dg-t" x="75.0" y="450.0" text-anchor="middle">باریک</text><text class="dg-s" x="75.0" y="472.0" text-anchor="middle">فِرْعَوْن</text><path class="dg-arrow" d="M465 456 L560 456" style="color:var(--muted)"/><text class="dg-s" x="518.5" y="446" text-anchor="middle" style="fill:var(--green);font-weight:700">ہاں</text><rect class="dg-box g" x="560" y="424" width="200" height="64" rx="12"/><text class="dg-t" x="660.0" y="450.0" text-anchor="middle">پُر</text><text class="dg-s" x="660.0" y="472.0" text-anchor="middle">قِرْطَاس، مِرْصَاد</text><rect class="dg-box " x="20" y="520" width="860" height="150" rx="12"/><text class="dg-t" x="450" y="548" text-anchor="middle">وقف میں (راء ساکن ہو جاتی ہے):</text><text class="dg-s" x="450" y="580" text-anchor="middle">ماقبل ساکن ہو تو: یاء ساکنہ ← باریک (خَبِير، خَيْر)  |  ورنہ ساکن سے پہلے کی حرکت: کسرہ ← باریک (الذِّكْر، السِّحْر)</text><text class="dg-s" x="450" y="610" text-anchor="middle">زبر یا پیش ← پُر (الْقَدْر، خُسْر)  |  واؤ/الف ساکن کے بعد ← پُر (النُّور، النَّار)</text><text class="dg-s" x="450" y="646" text-anchor="middle">«فِرْقٍ» (الشعراء: ۶۳) میں تفخیم اور ترقیق دونوں وجہیں ہیں</text></svg>